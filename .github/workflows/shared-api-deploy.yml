name: Shared API checks and deploy
on:
  push:
    branches: [main]
    paths: ['backend/**', 'voice/**', 'frontend/**', 'infra/**', '.github/workflows/shared-api-deploy.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', 'voice/**', 'frontend/**', 'infra/**', '.github/workflows/shared-api-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-api-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-root-only
          MYSQL_DATABASE: team8_ci_test
          MYSQL_USER: team8_ci
          MYSQL_PASSWORD: ci-disposable-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Full backend tests on disposable MySQL and Redis; voice contract tests
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: '3306'
          TEST_MYSQL_USER: team8_ci
          TEST_MYSQL_PASSWORD: ci-disposable-test-only
          TEST_MYSQL_DATABASE: team8_ci_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/14
        run: |
          PYTHONPATH=backend:backend/tests python -m pytest -q backend/tests
          PYTHONPATH=voice/mock_worker python -m pytest -q voice/mock_worker/test_app.py
          python -m pytest -q voice/call_worker/test_worker.py
          python -m py_compile infra/deploy-shared-api.py infra/real-call-test.py backend/real_test_setup.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install, types, consent contract, build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run typecheck
          node --test scripts/auth-consent.test.mjs scripts/real-call-form.test.mjs
          npm run build
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::239830941256:role/team8-github-shared-deploy
          aws-region: ap-northeast-2
      - name: Deploy the checked commit through a restricted SSM document
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command --document-name team8-deploy-shared-api \
            --instance-ids i-0042b1e737bed426a --parameters "CommitSha=$COMMIT_SHA" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          status=Pending
          for attempt in $(seq 1 240); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id i-0042b1e737bed426a --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id i-0042b1e737bed426a \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
          test "$status" = Success
      - name: Verify public readiness and deployed revision
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl --fail --retry 3 --retry-delay 3 https://team8-api.3.35.222.227.sslip.io/shared/ready
          actual=$(curl --fail --silent https://team8-api.3.35.222.227.sslip.io/shared/version | jq -r .commit)
          test "$actual" = "$COMMIT_SHA"
